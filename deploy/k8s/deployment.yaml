apiVersion: apps/v1
kind: Deployment
metadata:
  name: life-os
  namespace: life-os
spec:
  replicas: 2
  selector:
    matchLabels:
      app: life-os
  template:
    metadata:
      labels:
        app: life-os
    spec:
      containers:
        - name: life-os
          image: chenyuliang1996/life-os:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: life-os-config
          env:
            - name: LIFEOS_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LIFEOS_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: life-os-db
                  key: datasource-url
            - name: LIFEOS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: life-os-db
                  key: username
            - name: LIFEOS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: life-os-db
                  key: password
            - name: LIFEOS_FLYAI_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: life-os-config
                  key: LIFEOS_FLYAI_ENABLED
                  optional: true
            - name: LIFEOS_FLYAI_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: life-os-external
                  key: flyai-endpoint
                  optional: true
            - name: LIFEOS_FLYAI_TOOL_NAME
              valueFrom:
                secretKeyRef:
                  name: life-os-external
                  key: flyai-tool-name
                  optional: true
            - name: LIFEOS_CLAW_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: life-os-config
                  key: LIFEOS_CLAW_ENABLED
                  optional: true
            - name: LIFEOS_CLAW_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: life-os-external
                  key: claw-endpoint
                  optional: true
            - name: LIFEOS_CLAW_TOOL_NAME
              valueFrom:
                secretKeyRef:
                  name: life-os-external
                  key: claw-tool-name
                  optional: true
            - name: LIFEOS_CLAW_AUTH_HEADER_NAME
              valueFrom:
                secretKeyRef:
                  name: life-os-external
                  key: claw-auth-header-name
                  optional: true
            - name: LIFEOS_CLAW_AUTH_HEADER_VALUE
              valueFrom:
                secretKeyRef:
                  name: life-os-external
                  key: claw-auth-header-value
                  optional: true
            - name: LIFEOS_A2A_TRAVEL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: life-os-config
                  key: LIFEOS_A2A_TRAVEL_ENABLED
                  optional: true
            - name: LIFEOS_A2A_TRAVEL_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: life-os-external
                  key: travel-a2a-base-url
                  optional: true
          volumeMounts:
            - name: session-storage
              mountPath: /data/sessions
      volumes:
        - name: session-storage
          persistentVolumeClaim:
            claimName: life-os-session-pvc
