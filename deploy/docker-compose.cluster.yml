version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: life-os-postgres
    environment:
      POSTGRES_DB: life_os
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: lifeos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

  life-os-1:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: cluster
      LIFEOS_DATASOURCE_URL: jdbc:postgresql://postgres:5432/life_os
      LIFEOS_DATASOURCE_USERNAME: lifeos
      LIFEOS_DATASOURCE_PASSWORD: lifeos
      LIFEOS_DEPLOYMENT_MODE: distributed-cluster
      LIFEOS_PRIMARY_DATABASE: postgresql
      LIFEOS_RAG_STORE: postgresql-plus-pgvector
      LIFEOS_SESSION_STORE: shared-volume-json-session
      LIFEOS_TOPOLOGY: ag-ui-gateway-plus-stateless-app-replicas-with-travel-a2a
      LIFEOS_SESSION_STORAGE_DIR: /data/sessions
      LIFEOS_RAG_VECTOR_ENABLED: "true"
      LIFEOS_TRAVEL_SEARCH: claw-skill-plus-flyai-plus-seeded-fallback
      LIFEOS_TRAVEL_SPECIALIST: remote-a2a-travel-specialist-with-local-fallback
      LIFEOS_FLYAI_ENABLED: ${LIFEOS_FLYAI_ENABLED:-false}
      LIFEOS_FLYAI_ENDPOINT: ${LIFEOS_FLYAI_ENDPOINT:-}
      LIFEOS_FLYAI_TOOL_NAME: ${LIFEOS_FLYAI_TOOL_NAME:-}
      LIFEOS_CLAW_ENABLED: ${LIFEOS_CLAW_ENABLED:-false}
      LIFEOS_CLAW_ENDPOINT: ${LIFEOS_CLAW_ENDPOINT:-}
      LIFEOS_CLAW_TOOL_NAME: ${LIFEOS_CLAW_TOOL_NAME:-travel_search}
      LIFEOS_CLAW_AUTH_HEADER_NAME: ${LIFEOS_CLAW_AUTH_HEADER_NAME:-}
      LIFEOS_CLAW_AUTH_HEADER_VALUE: ${LIFEOS_CLAW_AUTH_HEADER_VALUE:-}
      LIFEOS_CLAW_TIMEOUT_SECONDS: ${LIFEOS_CLAW_TIMEOUT_SECONDS:-20}
      LIFEOS_A2A_TRAVEL_ENABLED: ${LIFEOS_A2A_TRAVEL_ENABLED:-false}
      LIFEOS_A2A_TRAVEL_BASE_URL: ${LIFEOS_A2A_TRAVEL_BASE_URL:-}
    depends_on:
      - postgres
    volumes:
      - lifeos-sessions:/data/sessions

  life-os-2:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: cluster
      LIFEOS_DATASOURCE_URL: jdbc:postgresql://postgres:5432/life_os
      LIFEOS_DATASOURCE_USERNAME: lifeos
      LIFEOS_DATASOURCE_PASSWORD: lifeos
      LIFEOS_DEPLOYMENT_MODE: distributed-cluster
      LIFEOS_PRIMARY_DATABASE: postgresql
      LIFEOS_RAG_STORE: postgresql-plus-pgvector
      LIFEOS_SESSION_STORE: shared-volume-json-session
      LIFEOS_TOPOLOGY: ag-ui-gateway-plus-stateless-app-replicas-with-travel-a2a
      LIFEOS_SESSION_STORAGE_DIR: /data/sessions
      LIFEOS_RAG_VECTOR_ENABLED: "true"
      LIFEOS_TRAVEL_SEARCH: claw-skill-plus-flyai-plus-seeded-fallback
      LIFEOS_TRAVEL_SPECIALIST: remote-a2a-travel-specialist-with-local-fallback
      LIFEOS_FLYAI_ENABLED: ${LIFEOS_FLYAI_ENABLED:-false}
      LIFEOS_FLYAI_ENDPOINT: ${LIFEOS_FLYAI_ENDPOINT:-}
      LIFEOS_FLYAI_TOOL_NAME: ${LIFEOS_FLYAI_TOOL_NAME:-}
      LIFEOS_CLAW_ENABLED: ${LIFEOS_CLAW_ENABLED:-false}
      LIFEOS_CLAW_ENDPOINT: ${LIFEOS_CLAW_ENDPOINT:-}
      LIFEOS_CLAW_TOOL_NAME: ${LIFEOS_CLAW_TOOL_NAME:-travel_search}
      LIFEOS_CLAW_AUTH_HEADER_NAME: ${LIFEOS_CLAW_AUTH_HEADER_NAME:-}
      LIFEOS_CLAW_AUTH_HEADER_VALUE: ${LIFEOS_CLAW_AUTH_HEADER_VALUE:-}
      LIFEOS_CLAW_TIMEOUT_SECONDS: ${LIFEOS_CLAW_TIMEOUT_SECONDS:-20}
      LIFEOS_A2A_TRAVEL_ENABLED: ${LIFEOS_A2A_TRAVEL_ENABLED:-false}
      LIFEOS_A2A_TRAVEL_BASE_URL: ${LIFEOS_A2A_TRAVEL_BASE_URL:-}
    depends_on:
      - postgres
    volumes:
      - lifeos-sessions:/data/sessions

  gateway:
    image: nginx:1.27-alpine
    container_name: life-os-gateway
    depends_on:
      - life-os-1
      - life-os-2
    ports:
      - "8080:80"
    volumes:
      - ./nginx/life-os.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-data:
  lifeos-sessions:
