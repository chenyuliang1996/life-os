server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true

spring:
  application:
    name: life-os
  datasource:
    url: ${LIFEOS_DATASOURCE_URL:jdbc:h2:file:./.data/life-os-db;MODE=PostgreSQL;AUTO_SERVER=TRUE}
    username: ${LIFEOS_DATASOURCE_USERNAME:sa}
    password: ${LIFEOS_DATASOURCE_PASSWORD:}
    driver-class-name: ${LIFEOS_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${LIFEOS_JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

agentscope:
  agent:
    name: life-os-orchestrator
  agui:
    path-prefix: /agui
    cors-enabled: true
    server-side-memory: true

lifeos:
  persistence:
    mode: ${LIFEOS_PERSISTENCE_MODE:database}
  session-storage-dir: .data/sessions
  confirmation:
    enabled: true
  rag:
    vector:
      enabled: ${LIFEOS_RAG_VECTOR_ENABLED:false}
      provider: ${LIFEOS_RAG_VECTOR_PROVIDER:openai}
      model-name: ${LIFEOS_RAG_VECTOR_MODEL:text-embedding-3-small}
      dimensions: ${LIFEOS_RAG_VECTOR_DIMENSIONS:1536}
      schema: ${LIFEOS_RAG_VECTOR_SCHEMA:public}
      table-name: ${LIFEOS_RAG_VECTOR_TABLE:life_os_knowledge_vectors}
      distance-type: ${LIFEOS_RAG_VECTOR_DISTANCE:cosine}
      connection-timeout-ms: ${LIFEOS_RAG_VECTOR_TIMEOUT_MS:10000}
      score-threshold: ${LIFEOS_RAG_VECTOR_SCORE_THRESHOLD:0.2}
      chunk-size: ${LIFEOS_RAG_VECTOR_CHUNK_SIZE:700}
      chunk-overlap: ${LIFEOS_RAG_VECTOR_CHUNK_OVERLAP:120}
      max-chunks: ${LIFEOS_RAG_VECTOR_MAX_CHUNKS:8}
      openai-api-key: ${OPENAI_API_KEY:}
      openai-base-url: ${OPENAI_BASE_URL:}
      ollama-base-url: ${OLLAMA_BASE_URL:}
  flyai:
    enabled: ${LIFEOS_FLYAI_ENABLED:false}
    transport: ${LIFEOS_FLYAI_TRANSPORT:sse}
    endpoint: ${LIFEOS_FLYAI_ENDPOINT:}
    tool-name: ${LIFEOS_FLYAI_TOOL_NAME:}
    auth-header-name: ${LIFEOS_FLYAI_AUTH_HEADER_NAME:}
    auth-header-value: ${LIFEOS_FLYAI_AUTH_HEADER_VALUE:}
    timeout-seconds: ${LIFEOS_FLYAI_TIMEOUT_SECONDS:20}
  a2a:
    travel:
      enabled: ${LIFEOS_A2A_TRAVEL_ENABLED:false}
      base-url: ${LIFEOS_A2A_TRAVEL_BASE_URL:}
      card-path: ${LIFEOS_A2A_TRAVEL_CARD_PATH:/.well-known/agent.json}
      auth-header-name: ${LIFEOS_A2A_TRAVEL_AUTH_HEADER_NAME:}
      auth-header-value: ${LIFEOS_A2A_TRAVEL_AUTH_HEADER_VALUE:}
      timeout-seconds: ${LIFEOS_A2A_TRAVEL_TIMEOUT_SECONDS:15}
  architecture:
    deployment-mode: ${LIFEOS_DEPLOYMENT_MODE:single-node}
    persistence-mode: ${LIFEOS_PERSISTENCE_MODE:database}
    primary-database: ${LIFEOS_PRIMARY_DATABASE:h2-file}
    rag-store: ${LIFEOS_RAG_STORE:hybrid-text-plus-pgvector-ready}
    session-store: ${LIFEOS_SESSION_STORE:json-session}
    topology: ${LIFEOS_TOPOLOGY:modular-monolith-ready-for-cluster}
    travel-search: ${LIFEOS_TRAVEL_SEARCH:seeded-search-plus-optional-flyai}
    travel-specialist: ${LIFEOS_TRAVEL_SPECIALIST:local-travel-agent-plus-optional-a2a}
  runtime:
    openai-api-key: ${OPENAI_API_KEY:}
    openai-base-url: ${OPENAI_BASE_URL:}
    openai-model: ${OPENAI_MODEL:gpt-4.1-mini}
    ollama-base-url: ${OLLAMA_BASE_URL:}
    ollama-model: ${OLLAMA_MODEL:qwen2.5:7b}
  service:
    target-dau: ${LIFEOS_TARGET_DAU:200000}
    target-peak-qps: ${LIFEOS_TARGET_PEAK_QPS:30}
    availability-slo: ${LIFEOS_AVAILABILITY_SLO:99.9}
    assistant-p95-ms: ${LIFEOS_ASSISTANT_P95_MS:2200}
    confirmation-p95-ms: ${LIFEOS_CONFIRMATION_P95_MS:900}
    ux-bootstrap-p95-ms: ${LIFEOS_UX_BOOTSTRAP_P95_MS:1800}
    ux-interaction-p95-ms: ${LIFEOS_UX_INTERACTION_P95_MS:1200}
