server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true

spring:
  application:
    name: life-os
  datasource:
    url: ${LIFEOS_DATASOURCE_URL:jdbc:h2:file:./.data/life-os-db;MODE=PostgreSQL;AUTO_SERVER=TRUE}
    username: ${LIFEOS_DATASOURCE_USERNAME:sa}
    password: ${LIFEOS_DATASOURCE_PASSWORD:}
    driver-class-name: ${LIFEOS_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${LIFEOS_JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

agentscope:
  agent:
    name: life-os-orchestrator
  agui:
    path-prefix: /agui
    cors-enabled: true
    server-side-memory: true

lifeos:
  persistence:
    mode: ${LIFEOS_PERSISTENCE_MODE:database}
  session-storage-dir: .data/sessions
  auth:
    session-ttl-hours: ${LIFEOS_AUTH_SESSION_TTL_HOURS:72}
    password-pepper: ${LIFEOS_AUTH_PASSWORD_PEPPER:life-os-local-pepper}
    registration-enabled: ${LIFEOS_AUTH_REGISTRATION_ENABLED:true}
  confirmation:
    enabled: true
  poi:
    seed-enabled: ${LIFEOS_POI_SEED_ENABLED:true}
    discovery-limit: ${LIFEOS_POI_DISCOVERY_LIMIT:10}
    crawler:
      enabled: ${LIFEOS_POI_CRAWLER_ENABLED:false}
      schedule-enabled: ${LIFEOS_POI_CRAWLER_SCHEDULE_ENABLED:true}
      schedule-cron: ${LIFEOS_POI_CRAWLER_SCHEDULE_CRON:0 */30 * * * *}
      retention-days: ${LIFEOS_POI_CRAWLER_RETENTION_DAYS:14}
      max-items-per-source: ${LIFEOS_POI_CRAWLER_MAX_ITEMS_PER_SOURCE:30}
      request-timeout-seconds: ${LIFEOS_POI_CRAWLER_TIMEOUT_SECONDS:12}
      xiaohongshu:
        enabled: ${LIFEOS_POI_XHS_ENABLED:false}
        endpoint: ${LIFEOS_POI_XHS_ENDPOINT:}
        auth-header-name: ${LIFEOS_POI_XHS_AUTH_HEADER_NAME:}
        auth-header-value: ${LIFEOS_POI_XHS_AUTH_HEADER_VALUE:}
        locale: ${LIFEOS_POI_XHS_LOCALE:zh-CN}
      mafengwo:
        enabled: ${LIFEOS_POI_MFW_ENABLED:false}
        endpoint: ${LIFEOS_POI_MFW_ENDPOINT:}
        auth-header-name: ${LIFEOS_POI_MFW_AUTH_HEADER_NAME:}
        auth-header-value: ${LIFEOS_POI_MFW_AUTH_HEADER_VALUE:}
        locale: ${LIFEOS_POI_MFW_LOCALE:zh-CN}
  rag:
    vector:
      enabled: ${LIFEOS_RAG_VECTOR_ENABLED:false}
      provider: ${LIFEOS_RAG_VECTOR_PROVIDER:openai}
      model-name: ${LIFEOS_RAG_VECTOR_MODEL:text-embedding-3-small}
      dimensions: ${LIFEOS_RAG_VECTOR_DIMENSIONS:1536}
      schema: ${LIFEOS_RAG_VECTOR_SCHEMA:public}
      table-name: ${LIFEOS_RAG_VECTOR_TABLE:life_os_knowledge_vectors}
      distance-type: ${LIFEOS_RAG_VECTOR_DISTANCE:cosine}
      connection-timeout-ms: ${LIFEOS_RAG_VECTOR_TIMEOUT_MS:10000}
      score-threshold: ${LIFEOS_RAG_VECTOR_SCORE_THRESHOLD:0.2}
      chunk-size: ${LIFEOS_RAG_VECTOR_CHUNK_SIZE:700}
      chunk-overlap: ${LIFEOS_RAG_VECTOR_CHUNK_OVERLAP:120}
      max-chunks: ${LIFEOS_RAG_VECTOR_MAX_CHUNKS:8}
      openai-api-key: ${OPENAI_API_KEY:}
      openai-base-url: ${OPENAI_BASE_URL:}
      ollama-base-url: ${OLLAMA_BASE_URL:}
  flyai:
    enabled: ${LIFEOS_FLYAI_ENABLED:false}
    mode: ${LIFEOS_FLYAI_MODE:hybrid}
    transport: ${LIFEOS_FLYAI_TRANSPORT:sse}
    endpoint: ${LIFEOS_FLYAI_ENDPOINT:}
    tool-name: ${LIFEOS_FLYAI_TOOL_NAME:}
    auth-header-name: ${LIFEOS_FLYAI_AUTH_HEADER_NAME:}
    auth-header-value: ${LIFEOS_FLYAI_AUTH_HEADER_VALUE:}
    timeout-seconds: ${LIFEOS_FLYAI_TIMEOUT_SECONDS:20}
    cli-enabled: ${LIFEOS_FLYAI_CLI_ENABLED:false}
    cli-command: ${LIFEOS_FLYAI_CLI_COMMAND:flyai}
    cli-working-directory: ${LIFEOS_FLYAI_CLI_WORKING_DIRECTORY:}
    cli-timeout-seconds: ${LIFEOS_FLYAI_CLI_TIMEOUT_SECONDS:18}
  claw:
    enabled: ${LIFEOS_CLAW_ENABLED:false}
    transport: ${LIFEOS_CLAW_TRANSPORT:sse}
    endpoint: ${LIFEOS_CLAW_ENDPOINT:}
    tool-name: ${LIFEOS_CLAW_TOOL_NAME:travel_search}
    auth-header-name: ${LIFEOS_CLAW_AUTH_HEADER_NAME:}
    auth-header-value: ${LIFEOS_CLAW_AUTH_HEADER_VALUE:}
    timeout-seconds: ${LIFEOS_CLAW_TIMEOUT_SECONDS:20}
  a2a:
    travel:
      enabled: ${LIFEOS_A2A_TRAVEL_ENABLED:false}
      base-url: ${LIFEOS_A2A_TRAVEL_BASE_URL:}
      card-path: ${LIFEOS_A2A_TRAVEL_CARD_PATH:/.well-known/agent.json}
      auth-header-name: ${LIFEOS_A2A_TRAVEL_AUTH_HEADER_NAME:}
      auth-header-value: ${LIFEOS_A2A_TRAVEL_AUTH_HEADER_VALUE:}
      timeout-seconds: ${LIFEOS_A2A_TRAVEL_TIMEOUT_SECONDS:15}
  architecture:
    deployment-mode: ${LIFEOS_DEPLOYMENT_MODE:single-node}
    persistence-mode: ${LIFEOS_PERSISTENCE_MODE:database}
    primary-database: ${LIFEOS_PRIMARY_DATABASE:h2-file}
    rag-store: ${LIFEOS_RAG_STORE:hybrid-text-plus-pgvector-ready}
    session-store: ${LIFEOS_SESSION_STORE:json-session}
    topology: ${LIFEOS_TOPOLOGY:modular-monolith-ready-for-cluster}
    travel-search: ${LIFEOS_TRAVEL_SEARCH:intent-router-plus-flyai-cli-with-fallback}
    travel-specialist: ${LIFEOS_TRAVEL_SPECIALIST:local-travel-agent-plus-optional-a2a}
  runtime:
    openai-api-key: ${OPENAI_API_KEY:}
    openai-base-url: ${OPENAI_BASE_URL:}
    openai-model: ${OPENAI_MODEL:gpt-4.1-mini}
    ollama-base-url: ${OLLAMA_BASE_URL:}
    ollama-model: ${OLLAMA_MODEL:qwen2.5:7b}
  security:
    trusted-user-prefixes: ${LIFEOS_SECURITY_TRUSTED_PREFIXES:lifeos-,persona-}
    operator-user-prefixes: ${LIFEOS_SECURITY_OPERATOR_PREFIXES:persona-ops,ops-,admin-}
    restricted-user-prefixes: ${LIFEOS_SECURITY_RESTRICTED_PREFIXES:guest-,external-}
    mcp-trusted-user-prefixes: ${LIFEOS_SECURITY_MCP_PREFIXES:lifeos-,persona-travel,persona-mbti-,persona-ops}
    outbound-allowlist: ${LIFEOS_SECURITY_ALLOWLIST:api.openai.com,localhost,127.0.0.1,open.fly.ai,clawhub.ai,flyai.example}
    outbound-network-enabled: ${LIFEOS_SECURITY_OUTBOUND_ENABLED:true}
    exec-enabled: ${LIFEOS_SECURITY_EXEC_ENABLED:false}
    force-approval-for-operators: ${LIFEOS_SECURITY_FORCE_APPROVAL_OPERATORS:true}
  service:
    target-dau: ${LIFEOS_TARGET_DAU:200000}
    target-peak-qps: ${LIFEOS_TARGET_PEAK_QPS:30}
    availability-slo: ${LIFEOS_AVAILABILITY_SLO:99.9}
    assistant-p95-ms: ${LIFEOS_ASSISTANT_P95_MS:2200}
    confirmation-p95-ms: ${LIFEOS_CONFIRMATION_P95_MS:900}
    ux-bootstrap-p95-ms: ${LIFEOS_UX_BOOTSTRAP_P95_MS:1800}
    ux-interaction-p95-ms: ${LIFEOS_UX_INTERACTION_P95_MS:1200}
