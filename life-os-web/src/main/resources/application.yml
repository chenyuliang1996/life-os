server:
  port: 8080

spring:
  application:
    name: life-os

agentscope:
  agent:
    name: life-os-orchestrator
  agui:
    path-prefix: /agui
    cors-enabled: true
    server-side-memory: true

lifeos:
  session-storage-dir: .data/sessions
  confirmation:
    enabled: true
  runtime:
    openai-api-key: ${OPENAI_API_KEY:}
    openai-base-url: ${OPENAI_BASE_URL:}
    openai-model: ${OPENAI_MODEL:gpt-4.1-mini}
    ollama-base-url: ${OLLAMA_BASE_URL:}
    ollama-model: ${OLLAMA_MODEL:qwen2.5:7b}
