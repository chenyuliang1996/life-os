spring:
  datasource:
    url: ${LIFEOS_DATASOURCE_URL:jdbc:postgresql://postgres:5432/life_os}
    username: ${LIFEOS_DATASOURCE_USERNAME:lifeos}
    password: ${LIFEOS_DATASOURCE_PASSWORD:lifeos}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${LIFEOS_JPA_DDL_AUTO:update}
  h2:
    console:
      enabled: false

lifeos:
  architecture:
    deployment-mode: distributed-cluster
    persistence-mode: database
    primary-database: postgresql
    rag-store: postgresql-plus-pgvector
    session-store: shared-volume-json-session
    topology: ag-ui-gateway-plus-stateless-app-replicas-with-travel-a2a
    travel-search: intent-router-plus-flyai-cli-with-fallback
    travel-specialist: remote-a2a-travel-specialist-with-local-fallback
  session-storage-dir: ${LIFEOS_SESSION_STORAGE_DIR:/data/sessions}
  auth:
    session-ttl-hours: ${LIFEOS_AUTH_SESSION_TTL_HOURS:72}
    password-pepper: ${LIFEOS_AUTH_PASSWORD_PEPPER:life-os-cluster-pepper}
    registration-enabled: ${LIFEOS_AUTH_REGISTRATION_ENABLED:true}
  rag:
    vector:
      enabled: ${LIFEOS_RAG_VECTOR_ENABLED:true}
  flyai:
    enabled: ${LIFEOS_FLYAI_ENABLED:false}
    mode: ${LIFEOS_FLYAI_MODE:hybrid}
    transport: ${LIFEOS_FLYAI_TRANSPORT:sse}
    endpoint: ${LIFEOS_FLYAI_ENDPOINT:}
    tool-name: ${LIFEOS_FLYAI_TOOL_NAME:}
    cli-enabled: ${LIFEOS_FLYAI_CLI_ENABLED:false}
    cli-command: ${LIFEOS_FLYAI_CLI_COMMAND:flyai}
    cli-working-directory: ${LIFEOS_FLYAI_CLI_WORKING_DIRECTORY:}
    cli-timeout-seconds: ${LIFEOS_FLYAI_CLI_TIMEOUT_SECONDS:18}
  claw:
    enabled: ${LIFEOS_CLAW_ENABLED:false}
    transport: ${LIFEOS_CLAW_TRANSPORT:sse}
    endpoint: ${LIFEOS_CLAW_ENDPOINT:}
    tool-name: ${LIFEOS_CLAW_TOOL_NAME:travel_search}
    auth-header-name: ${LIFEOS_CLAW_AUTH_HEADER_NAME:}
    auth-header-value: ${LIFEOS_CLAW_AUTH_HEADER_VALUE:}
    timeout-seconds: ${LIFEOS_CLAW_TIMEOUT_SECONDS:20}
  a2a:
    travel:
      enabled: ${LIFEOS_A2A_TRAVEL_ENABLED:false}
      base-url: ${LIFEOS_A2A_TRAVEL_BASE_URL:}
      card-path: ${LIFEOS_A2A_TRAVEL_CARD_PATH:/.well-known/agent.json}
