spring:
  datasource:
    url: jdbc:h2:mem:lifeos;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: false

lifeos:
  persistence:
    mode: database
  session-storage-dir: ${java.io.tmpdir}/life-os-test-sessions
  auth:
    session-ttl-hours: 24
    password-pepper: test-pepper
    registration-enabled: true
  rag:
    vector:
      enabled: false
  flyai:
    enabled: false
  claw:
    enabled: false
  a2a:
    travel:
      enabled: false
